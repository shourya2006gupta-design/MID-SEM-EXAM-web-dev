<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="tracker-page">

        <header>
            <h1>Jeb Kharchi</h1>

            <p>Student Expense Tracker</p>
        </header>

        <div class="details">

            <main>
                <fieldset>

                    <legend>Expense Details</legend>
                    <p>Fill your expense details</p>

                    <form id="expense-form">

                        <label for="expense-note">Note:</label>
                        <input type="text" placeholder="Note about the expense" id="expense-note">

                        <label for="expense-amount">Amount:</label>
                        <input type="number" placeholder="Amount spent" id="expense-amount" min="0.01" step="0.01"
                            required>

                        <label for="expense-date">Date:</label>
                        <input type="date" id="expense-date" required>

                        <label for="expense-category">Category:</label>
                        <select id="expense-category" required>
                            <option value="" disabled selected>Select category</option>
                            <option value="food">Food</option>
                            <option value="transport">Transport</option>
                            <option value="shopping">Shopping</option>
                            <option value="entertainment">Entertainment</option>
                            <option value="education">Education</option>
                            <option value="other">Other</option>
                        </select>

                        <button id="add-expense" type="submit">
                            Add Expense
                        </button>

                    </form>
                </fieldset>
            </main>

            <aside>
                <fieldset>
                    <legend>Expense Summary</legend>
                    <p>Your expense summary</p>

                    <div class="summary">
                        <p>Total Expenses: ₹<span id="total-expenses">0</span></p>
                        <p>Food: ₹<span id="food-expenses">0</span></p>
                        <p>Transport: ₹<span id="transport-expenses">0</span></p>
                        <p>Shopping: ₹<span id="shopping-expenses">0</span></p>
                        <p>Entertainment: ₹<span id="entertainment-expenses">0</span></p>
                        <p>Education: ₹<span id="education-expenses">0</span></p>
                        <p>Other: ₹<span id="other-expenses">0</span></p>
                    </div>
                </fieldset>

                <fieldset>

                    <legend>Expense History</legend>
                    <p>Your expense details</p>

                    <label for="category-filter">Filter by Category:</label>

                    <select id="category-filter">
                        <option value="all">All Categories</option>
                        <option value="food">Food</option>
                        <option value="transport">Transport</option>
                        <option value="shopping">Shopping</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="education">Education</option>
                        <option value="other">Other</option>
                    </select>

                    <div class="expense-details">
                        <ul id="expense-list">
                            <!-- JavaScript will update this -->
                        </ul>
                    </div>

                </fieldset>
            </aside>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
